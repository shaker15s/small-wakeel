name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wakil-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: full-local-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./db/custom.db
      WAKIL_OFFLINE: '1'
      WAKIL_SCHEDULER: 'off'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Run full deterministic and process-recovery gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-results
          bash scripts/ci.sh 2>&1 | tee .ci-results/gate.log
      - name: Upload SHA-bound test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-gate-${{ github.sha }}
          path: .ci-results/gate.log
          if-no-files-found: warn
          retention-days: 30
