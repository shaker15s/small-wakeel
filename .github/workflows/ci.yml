name: WAKIL CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: wakil-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: full-validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: file:./db/custom.db
      WAKIL_OFFLINE: '1'
      WAKIL_SCHEDULER: 'off'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Prepare validation artifact directory
        shell: bash
        run: mkdir -p ci-results
      - name: Run full local gate (typecheck, lint, tests, crash recovery, evals, build, HTTP and browser smoke)
        shell: bash
        run: |
          set -euo pipefail
          # Speech and model-acceptance contract tests require the documented local mock.
          bun mini-services/mock-provider/index.ts > ci-results/mock-provider.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3031/health > /dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:3031/health > /dev/null; then
            echo 'Mock provider did not become healthy; last logs:'
            cat ci-results/mock-provider.log
            exit 1
          fi
          bash scripts/ci.sh 2>&1 | tee ci-results/ci.log
      - name: Run explicit launch-evidence gate
        if: success()
        shell: bash
        run: |
          set -o pipefail
          node scripts/pilot-gate.mjs --report ci-results/pilot-gate.json 2>&1 | tee ci-results/pilot-gate.log
          node -e "const fs=require('node:fs'); fs.writeFileSync('ci-results/run-metadata.json', JSON.stringify({sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,workflow:process.env.GITHUB_WORKFLOW,repository:process.env.GITHUB_REPOSITORY,recordedAt:new Date().toISOString()},null,2))"
      - name: Upload logs and machine-readable gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wakil-validation-${{ github.sha }}-${{ github.run_id }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 30
