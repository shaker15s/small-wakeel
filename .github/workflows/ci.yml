name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wakil-ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: full-local-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./db/custom.db
      WAKIL_OFFLINE: '1'
      WAKIL_SCHEDULER: 'off'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Run full deterministic and process-recovery gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-results
          bash scripts/ci.sh 2>&1 | tee .ci-results/gate.log
      - name: Upload SHA-bound test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-gate-${{ github.sha }}
          path: .ci-results/gate.log
          if-no-files-found: warn
          retention-days: 30
