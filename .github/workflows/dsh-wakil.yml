name: WAKIL DSH integration

on:
  push:
    branches:
      - feat/dsh-wakil-profile
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wakil-dsh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsh-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./db/custom.db
      WAKIL_OFFLINE: '1'
      WAKIL_SCHEDULER: 'off'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install locked dependencies and generate Prisma client
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Lint the bridge, DSH bundle and acceptance tests
        run: bunx eslint src/lib/dsh-bridge/bridge.ts src/app/api/dsh/bridge/route.ts tests/integration/dsh-bridge.test.ts dsh-wakil-bundle/index.js
      - name: Run draft-only tenant-bound integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-results
          bun test tests/integration/dsh-bridge.test.ts 2>&1 | tee .ci-results/dsh-bridge.log
      - name: Upload SHA-bound integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-bridge-${{ github.sha }}
          path: .ci-results/dsh-bridge.log
          if-no-files-found: warn
          retention-days: 14
