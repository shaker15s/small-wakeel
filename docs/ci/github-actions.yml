name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: launch-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./db/custom.db
      WAKIL_OFFLINE: '1'
      WAKIL_SCHEDULER: 'off'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Full local and CI gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-results
          bash scripts/ci.sh 2>&1 | tee .ci-results/gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-gate-${{ github.sha }}
          path: .ci-results/gate.log
          retention-days: 14
