# Controlled single-instance pilot ONLY; see docs/SECURITY.md before running.
# Credentials/keys must come from an untracked operator environment.
services:
  wakil:
    build: .
    image: small-wakeel:local
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: file:/app/db/custom.db
      WAKIL_AUTH_CREDENTIALS: ${WAKIL_AUTH_CREDENTIALS:?Configure per-user hashed credentials first}
      WAKIL_SECRETS_KEY: ${WAKIL_SECRETS_KEY:?Configure an external 32-byte hex encryption key}
      WAKIL_HEALTH_TOKEN: ${WAKIL_HEALTH_TOKEN:?Configure an admin credential for the health probe}
      WAKIL_ALLOWED_ORIGINS: ${WAKIL_ALLOWED_ORIGINS:?Configure the HTTPS dashboard origin}
      WAKIL_SAAS_ENABLED: ${WAKIL_SAAS_ENABLED:-0}
      WAKIL_SIGNUP_ENABLED: ${WAKIL_SIGNUP_ENABLED:-0}
      WAKIL_APP_URL: ${WAKIL_APP_URL:-}
      WAKIL_MAIL_ENDPOINT: ${WAKIL_MAIL_ENDPOINT:-}
      WAKIL_MAIL_TOKEN: ${WAKIL_MAIL_TOKEN:-}
      WAKIL_SCHEDULER: ${WAKIL_SCHEDULER:-off}
      WAKIL_STRICT_APPROVALS: '1'
    volumes:
      - wakil-db:/app/db
    restart: unless-stopped

  # Opt-in worker supervisor. This does NOT provision a mail gateway.
  # Build/migrate with all writers stopped before enabling either service.
  mail-worker:
    profiles: ['mail']
    image: small-wakeel:local
    command: ['sh', '-c', 'while true; do bun maintenance/mail-worker.js || exit 1; sleep 60; done']
    environment:
      DATABASE_URL: file:/app/db/custom.db
      WAKIL_SECRETS_KEY: ${WAKIL_SECRETS_KEY:?Configure an external 32-byte hex encryption key}
      WAKIL_APP_URL: ${WAKIL_APP_URL:-}
      WAKIL_MAIL_ENDPOINT: ${WAKIL_MAIL_ENDPOINT:-}
      WAKIL_MAIL_TOKEN: ${WAKIL_MAIL_TOKEN:-}
    volumes:
      - wakil-db:/app/db
    healthcheck:
      disable: true # worker is not an HTTP server; supervise its exit/logs/queue age
    restart: unless-stopped

volumes:
  wakil-db:
